  <body>
    <div id="root"></div>
    <script>
      (function () {
        // Add more images here: put the file in public/Gallery/, then add { src, alt }.
        const GALLERY_IMAGES = [
          { src: '/Gallery/about-instructor.png', alt: 'About instructor' },
          { src: '/Gallery/hero-bg.png', alt: 'Learning experience' },
          { src: '/Gallery/opengraph.jpg', alt: 'Monali Driving School' },
        ];

        const section = document.createElement('section');
        section.id = 'gallery';
        section.className = 'gallery-section';
        section.innerHTML = `
          <div class="gallery-wrap">
            <div class="gallery-header">
              <h3>Our Learning Experience</h3>
              <p>Our learning environment and student journey.</p>
            </div>
            <div class="gallery-grid" id="gallery-grid"></div>
          </div>
        `;

        const grid = section.querySelector('#gallery-grid');
        if (grid) {
          if (!GALLERY_IMAGES.length) {
            grid.innerHTML = '<div class="gallery-empty">No gallery images found.</div>';
          } else {
            grid.innerHTML = GALLERY_IMAGES.map((image) => `
              <div class="gallery-item">
                <img src="${image.src}" alt="${image.alt}" loading="lazy" />
              </div>
            `).join('');
          }
        }

        function placeGallery() {
          const about = document.getElementById('about');
          const root = document.getElementById('root');
          if (about) {
            if (about.nextElementSibling !== section) {
              about.insertAdjacentElement('afterend', section);
            }
            return;
          }
          if (root && section.parentElement !== document.body) {
            root.insertAdjacentElement('afterend', section);
          }
        }

        function scrollToGallery(event) {
          if (event) event.preventDefault();
          const target = document.getElementById('gallery');
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function insertAfterReviews(container, node, matchText) {
          const reviews = Array.from(container.children).find((el) =>
            (el.textContent || '').trim() === matchText
          );
          if (reviews) {
            reviews.insertAdjacentElement('afterend', node);
          } else {
            container.appendChild(node);
          }
        }

        function injectGalleryQuickLink() {
          if (document.getElementById('gallery-quick-link')) return;

          const headings = Array.from(document.querySelectorAll('h4'));
          const quickLinksHeading = headings.find((el) => el.textContent.trim() === 'Quick Links');
          if (!quickLinksHeading) return;

          const list = quickLinksHeading.parentElement && quickLinksHeading.parentElement.querySelector('ul');
          if (!list) return;

          const item = document.createElement('li');
          item.id = 'gallery-quick-link';
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'text-slate-400 hover:text-accent transition-colors text-sm';
          button.textContent = 'Gallery';
          button.addEventListener('click', scrollToGallery);
          item.appendChild(button);
          insertAfterReviews(list, item, 'Reviews');
        }

        function injectGalleryHeaderLinks() {
          // Desktop header nav (<ul> with Home/About/Services/Reviews/Contact)
          if (!document.getElementById('gallery-header-link')) {
            const desktopNav = Array.from(document.querySelectorAll('header ul, nav ul')).find((ul) => {
              const labels = Array.from(ul.querySelectorAll('button, a')).map((el) => el.textContent.trim());
              return labels.includes('About') && labels.includes('Services') && labels.includes('Reviews');
            });
            if (desktopNav) {
              const scrolled = window.scrollY > 20;
              const item = document.createElement('li');
              item.id = 'gallery-header-link';
              const button = document.createElement('button');
              button.type = 'button';
              button.className = scrolled
                ? 'text-sm font-medium hover:text-accent transition-colors text-slate-600'
                : 'text-sm font-medium hover:text-accent transition-colors text-slate-200 hover:text-white';
              button.textContent = 'Gallery';
              button.addEventListener('click', scrollToGallery);
              item.appendChild(button);
              insertAfterReviews(desktopNav, item, 'Reviews');
            }
          } else {
            // Keep desktop link colors in sync with sticky header state
            const headerBtn = document.querySelector('#gallery-header-link button');
            if (headerBtn) {
              const scrolled = window.scrollY > 20;
              headerBtn.className = scrolled
                ? 'text-sm font-medium hover:text-accent transition-colors text-slate-600'
                : 'text-sm font-medium hover:text-accent transition-colors text-slate-200 hover:text-white';
            }
          }

          // Mobile menu buttons (full-width primary style)
          if (!document.getElementById('gallery-mobile-link')) {
            const mobileButtons = Array.from(document.querySelectorAll('button')).filter((btn) =>
              btn.className.includes('text-primary') &&
              btn.className.includes('w-full') &&
              ['Home', 'About', 'Services', 'Reviews', 'Contact'].includes(btn.textContent.trim())
            );
            if (mobileButtons.length >= 4) {
              const reviewsBtn = mobileButtons.find((btn) => btn.textContent.trim() === 'Reviews');
              const button = document.createElement('button');
              button.id = 'gallery-mobile-link';
              button.type = 'button';
              button.className = 'text-primary font-medium w-full py-2 hover:bg-slate-50';
              button.textContent = 'Gallery';
              button.addEventListener('click', scrollToGallery);
              if (reviewsBtn && reviewsBtn.parentElement) {
                reviewsBtn.insertAdjacentElement('afterend', button);
              } else {
                mobileButtons[mobileButtons.length - 1].insertAdjacentElement('afterend', button);
              }
            }
          }
        }

        function sync() {
          placeGallery();
          injectGalleryQuickLink();
          injectGalleryHeaderLinks();
        }

        function start() {
          sync();
          const root = document.getElementById('root');
          if (root) {
            const observer = new MutationObserver(sync);
            observer.observe(root, { childList: true, subtree: true });
          }
        }

        if (document.readyState === 'complete') {
          setTimeout(start, 150);
        } else {
          window.addEventListener('load', function () {
            setTimeout(start, 150);
          });
        }
      })();
    </script>
    <style>
      .gallery-section {
        padding: 64px 20px 48px;
        background: #f8fafc;
      }
      .gallery-wrap {
        max-width: 1200px;
        margin: 0 auto;
      }
      .gallery-header {
        text-align: center;
        margin-bottom: 28px;
      }
      .gallery-header h3 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 3vw, 2.8rem);
        color: #0f172a;
        font-weight: 800;
      }
      .gallery-header p {
        margin: 0;
        color: #475569;
        font-size: 1rem;
      }
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
      }
      .gallery-item {
        overflow: hidden;
        border-radius: 18px;
        background: #fff;
        border: 1px solid rgba(148, 163, 184, 0.2);
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      }
      .gallery-item img {
        display: block;
        width: 100%;
        height: 260px;
        object-fit: cover;
        transition: transform 0.3s ease;
      }
      .gallery-item:hover img {
        transform: scale(1.04);
      }
      .gallery-empty {
        padding: 24px;
        text-align: center;
        color: #475569;
        background: #fff;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
      @media (max-width: 960px) {
        .gallery-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 560px) {
        .gallery-grid {
          grid-template-columns: 1fr;
        }
        .gallery-item img {
          height: 220px;
        }
      }
    </style>
